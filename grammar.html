<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnglishExam — Grammar Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;min-height:100vh}
header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:700}.timer{font-size:20px;font-weight:700}
.container{max-width:900px;margin:30px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;color:#566573}
.question{font-size:21px;font-weight:700;line-height:1.5;margin-bottom:22px}
.option{display:block;width:100%;text-align:left;background:#f7f9fb;border:2px solid #e1e7ed;border-radius:12px;padding:15px;margin:10px 0;cursor:pointer;font-size:16px}
.option:hover{border-color:#6c7ae0}
.option.selected{border-color:#4f46e5;background:#eef0ff}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
button{border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:#4f46e5;color:#fff}.secondary{background:#e5e7eb;color:#111827}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:16px 0 25px}
.progress-bar{height:100%;background:#4f46e5;width:0;transition:.2s}
.result{text-align:center}.score{font-size:42px;font-weight:800;color:#4f46e5;margin:15px 0}
.hidden{display:none}
.review{margin-top:25px;text-align:left}.review-item{padding:14px;border-bottom:1px solid #e5e7eb}
.correct{color:#15803d}.wrong{color:#dc2626}
.loading{text-align:center;padding:60px}
</style>
</head>
<body>
<header><div class="logo">EnglishExam</div><div class="timer" id="timer">60:00</div></header>
<div class="container">
<div id="loading" class="card loading">Ստուգվում է մուտքը...</div>
<div id="testCard" class="card hidden">
<div class="info"><span>📘 Grammar Test</span><span id="counter">Հարց 1 / 40</span><span>🎯 20 միավոր</span></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="question" id="question"></div><div id="options"></div>
<div class="nav"><button class="secondary" id="prevBtn" onclick="previousQuestion()">← Նախորդ</button><button class="primary" id="nextBtn" onclick="nextQuestion()">Հաջորդ →</button></div>
</div>
<div id="resultCard" class="card result hidden">
<h2>Grammar Test — Արդյունք</h2><div class="score" id="finalScore">0 / 20</div><p id="resultText"></p>
<div class="review" id="review"></div>
<div style="margin-top:25px"><a href="index.html"><button class="primary">← Վերադառնալ գլխավոր էջ</button></a></div>
</div>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://zkmtvzbbaxwlscarstkc.supabase.co";
const SUPABASE_KEY="sb_publishable_VWDP871AYiFF0WaE2i03zA_X4P-MB9T";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const TEST_TYPE="Grammar";

const questions=[
{q:"She ___ to school every day.",a:["go","goes","going","gone"],c:1},
{q:"They ___ football yesterday.",a:["play","played","playing","plays"],c:1},
{q:"I ___ my homework now.",a:["do","did","am doing","have done"],c:2},
{q:"He ___ in Yerevan since 2020.",a:["lives","lived","has lived","is living"],c:2},
{q:"We ___ dinner before they arrived.",a:["had eaten","eat","have eaten","are eating"],c:0},
{q:"If I ___ time, I will help you.",a:["have","had","will have","having"],c:0},
{q:"She can ___ English very well.",a:["speaks","speaking","speak","spoke"],c:2},
{q:"There ___ many students in the room.",a:["is","are","was","be"],c:1},
{q:"My brother ___ TV at the moment.",a:["watches","watched","is watching","has watched"],c:2},
{q:"I ___ never been to London.",a:["have","has","had","am"],c:0},
{q:"When I was young, I ___ swim very well.",a:["can","could","may","must"],c:1},
{q:"You ___ study harder if you want to pass.",a:["should","would","couldn't","might"],c:0},
{q:"This book ___ by many students.",a:["uses","used","is used","using"],c:2},
{q:"They ___ their project tomorrow.",a:["finish","finished","will finish","finishing"],c:2},
{q:"He ___ breakfast before school every morning.",a:["has","have","having","had"],c:0},
{q:"I saw ___ interesting film last night.",a:["a","an","the","—"],c:1},
{q:"She is ___ than her sister.",a:["tall","taller","tallest","more tall"],c:1},
{q:"This is ___ best answer.",a:["a","an","the","—"],c:2},
{q:"There isn't ___ milk left.",a:["many","much","few","a few"],c:1},
{q:"I have ___ friends in this city.",a:["much","a little","a few","any"],c:2},
{q:"He is good ___ mathematics.",a:["in","on","at","for"],c:2},
{q:"We arrived ___ the airport at 8.",a:["in","at","on","to"],c:1},
{q:"She is interested ___ music.",a:["on","at","in","for"],c:2},
{q:"I went to school ___ bus.",a:["by","on","with","in"],c:0},
{q:"This is the man ___ helped me.",a:["which","who","where","when"],c:1},
{q:"The book ___ is on the table is mine.",a:["who","where","which","when"],c:2},
{q:"If I ___ you, I would apologize.",a:["am","was","were","be"],c:2},
{q:"She ___ already finished her work.",a:["has","have","had","is"],c:0},
{q:"They ___ here for two hours.",a:["wait","waited","have been waiting","are wait"],c:2},
{q:"By next year, he ___ university.",a:["finishes","finished","will have finished","has finished"],c:2},
{q:"I don't know ___ he is coming.",a:["what","whether","who","where"],c:1},
{q:"She asked me ___ I liked the movie.",a:["if","than","because","while"],c:0},
{q:"The opposite of 'easy' is ___.",a:["simple","difficult","quick","early"],c:1},
{q:"He ___ his keys, so he can't open the door.",a:["loses","lost","has lost","is losing"],c:2},
{q:"We ___ lunch when he called.",a:["have","had","were having","are having"],c:2},
{q:"The train ___ before we arrived.",a:["leaves","has left","had left","is leaving"],c:2},
{q:"You ___ smoke here. It is prohibited.",a:["mustn't","don't have","shouldn't to","can't to"],c:0},
{q:"I ___ like coffee, but now I do.",a:["didn't use to","don't used to","wasn't use to","didn't used"],c:0},
{q:"How long ___ you been learning English?",a:["do","did","have","are"],c:2},
{q:"She ___ her homework yet.",a:["didn't finish","hasn't finished","doesn't finished","not finished"],c:1}
];

let current=0,answers=Array(questions.length).fill(null),seconds=3600,timerInterval=null,user=null,finished=false;
function show(id){document.getElementById(id).classList.remove("hidden")}
function hide(id){document.getElementById(id).classList.add("hidden")}

async function init(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){document.getElementById("loading").innerHTML='Պետք է մուտք գործես։ <br><br><a href="index.html"><button class="primary">Մուտք / Գրանցում</button></a>';return}
 user=session.user;hide("loading");show("testCard");renderQuestion();timerInterval=setInterval(updateTimer,1000)
}
function renderQuestion(){
 const q=questions[current];document.getElementById("counter").textContent=`Հարց ${current+1} / ${questions.length}`;document.getElementById("question").textContent=q.q;
 const box=document.getElementById("options");box.innerHTML="";
 q.a.forEach((option,i)=>{const b=document.createElement("button");b.className="option"+(answers[current]===i?" selected":"");b.textContent=`${String.fromCharCode(65+i)}. ${option}`;b.onclick=()=>selectAnswer(i);box.appendChild(b)});
 document.getElementById("prevBtn").disabled=current===0;document.getElementById("nextBtn").textContent=current===questions.length-1?"Ավարտել ✓":"Հաջորդ →";document.getElementById("progressBar").style.width=((current+1)/questions.length*100)+"%"
}
function selectAnswer(i){answers[current]=i;renderQuestion()}
window.previousQuestion=()=>{if(current>0){current--;renderQuestion()}}
window.nextQuestion=()=>{if(answers[current]===null){alert("Ընտրիր պատասխան։");return}if(current<questions.length-1){current++;renderQuestion()}else finishTest()}
function updateTimer(){seconds--;if(seconds<0){finishTest();return}const m=Math.floor(seconds/60),s=seconds%60;document.getElementById("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;if(seconds<=60)document.getElementById("timer").style.color="#fca5a5"}

async function finishTest(){
 if(finished)return;finished=true;clearInterval(timerInterval);
 let correct=0;questions.forEach((q,i)=>{if(answers[i]===q.c)correct++});const score=correct*0.5;
 const {error}=await supabase.from("exam_results").insert({user_id:user.id,score:score,correct_answers:correct,total_questions:questions.length,test_type:TEST_TYPE});
 hide("testCard");show("resultCard");document.getElementById("finalScore").textContent=`${score} / 20`;document.getElementById("resultText").textContent=`Ճիշտ պատասխաններ՝ ${correct} / ${questions.length}`;
 const review=document.getElementById("review");review.innerHTML="";
 questions.forEach((q,i)=>{const div=document.createElement("div");div.className="review-item";const ok=answers[i]===q.c;div.innerHTML=`<b>${i+1}. ${q.q}</b><br>Քո պատասխանը՝ <span class="${ok?'correct':'wrong'}">${answers[i]===null?'Չի ընտրվել':q.a[answers[i]]}</span><br>Ճիշտ պատասխանը՝ <span class="correct">${q.a[q.c]}</span>`;review.appendChild(div)});
 if(error)console.error("Supabase save error:",error)
}
init();
</script>
</body>
</html>
