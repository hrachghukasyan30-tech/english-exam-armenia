<style>
* {

}

body {

header {

}

  margin-bottom: 30px;
}

.submit:hover {
  background: #1d4ed8;
}

#result {
  display: none;
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.result-score {
  font-size: 48px;
  font-weight: bold;
  color: #2563eb;
  margin: 15px 0;
}

.result-info {
  font-size: 18px;
  line-height: 1.8;
}

.back {
  display: inline-block;
  margin-top: 20px;
  text-decoration: none;
  color: #2563eb;
  font-weight: bold;

<script>

document.addEventListener("DOMContentLoaded", function () {

const questionsContainer =
document.getElementById("questions");


/*
  Այստեղ են հարցերը։

  answer = ճիշտ պատասխանի տառը։
*/

const questions = [

{
q: "She ___ to school every day.",
a: ["go", "goes", "going", "gone"],
answer: "b"
},

{
q: "I ___ this movie before.",
a: ["have seen", "has seen", "seeing", "saw"],
answer: "a"
},

{
q: "If I ___ more time, I would travel more.",
a: ["have", "had", "will have", "having"],
answer: "b"
},

{
q: "He is good ___ mathematics.",
a: ["in", "on", "at", "for"],
answer: "c"
},

{
q: "They ___ football when it started raining.",
a: ["played", "were playing", "are playing", "have played"],
answer: "b"
}

];


/*
  Մինչև 80 հարցը լրացնելը,
  համակարգը ստեղծում է մնացած հարցերը
  ժամանակավորապես։
*/

while (questions.length < 80) {

  let number = questions.length + 1;

  questions.push({
    q: "Practice question " + number,
    a: [
      "Answer A",
      "Answer B",
      "Answer C",
      "Answer D"
    ],
    answer: "a"
  });

}


/* Ստեղծում ենք 80 հարցը */

questions.forEach(function (item, index) {

  const number = index + 1;

  const div = document.createElement("div");

  div.className = "question";

  div.innerHTML = `

    <div class="question-number">
      Հարց ${number} / 80
    </div>

    <h3>${item.q}</h3>

    <label class="option">
      <input type="radio"
             name="q${number}"
             value="a">
      A) ${item.a[0]}
    </label>

    <label class="option">
      <input type="radio"
             name="q${number}"
             value="b">
      B) ${item.a[1]}
    </label>

    <label class="option">
      <input type="radio"
             name="q${number}"
             value="c">
      C) ${item.a[2]}
    </label>

    <label class="option">
      <input type="radio"
             name="q${number}"
             value="d">
      D) ${item.a[3]}
    </label>

  `;

  questionsContainer.appendChild(div);

});


/* 120 րոպե */

let timeLeft = 120 * 60;

const timer =
document.getElementById("timer");


function updateTimer() {

  let minutes =
  Math.floor(timeLeft / 60);

  let seconds =
  timeLeft % 60;

  timer.textContent =
    String(minutes).padStart(2, "0")
    + ":" +
    String(seconds).padStart(2, "0");

}


updateTimer();


const countdown =
setInterval(function () {

  timeLeft--;

  if (timeLeft <= 0) {

    timeLeft = 0;

    updateTimer();

    clearInterval(countdown);

    finishExam();

    return;
  }
