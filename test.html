<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EnglishExam — Փորձնական քննություն</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #17202a;
}

header {
  background: #111827;
  color: white;
  padding: 18px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.timer {
  background: #dc2626;
  padding: 9px 15px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 15px 50px;
}

.title {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.title h1 {
  margin-top: 0;
}

.question {
  background: white;
  margin-bottom: 18px;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.question h3 {
  margin-top: 0;
  font-size: 17px;
}

.option {
  display: block;
  background: #f3f4f6;
  margin: 9px 0;
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
}

.option:hover {
  background: #e5e7eb;
}

.option input {
  margin-right: 8px;
}

.finish {
  width: 100%;
  border: 0;
  background: #2563eb;
  color: white;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  cursor: pointer;
}

.finish:hover {
  background: #1d4ed8;
}

.result {
  display: none;
  background: white;
  margin-top: 25px;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.score {
  font-size: 42px;
  font-weight: bold;
  color: #2563eb;
}

.correct {
  color: #16a34a;
}

.wrong {
  color: #dc2626;
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">EnglishExam</div>
    <div class="timer" id="timer">120:00</div>
  </div>
</header>

  </div>
